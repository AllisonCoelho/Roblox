name: Roblox - Validacao e Deploy de Desenvolvimento

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy-dev:
    name: Construir e publicar no ambiente privado de testes
    runs-on: ubuntu-latest
    env:
      ROBLOX_TEST_UNIVERSE_ID: "10771776655"
      ROBLOX_TEST_PLACE_ID: "112360499723635"
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Rojo 7.7.1 para Linux x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rojo"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip" \
            --output "$RUNNER_TEMP/rojo.zip"
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          ROJO_BIN="$(find "$RUNNER_TEMP/rojo" -type f -name rojo -print -quit)"
          test -n "$ROJO_BIN"
          chmod +x "$ROJO_BIN"
          echo "$(dirname "$ROJO_BIN")" >> "$GITHUB_PATH"

      - name: Construir jogo com Rojo
        run: |
          mkdir -p dist
          rojo build default.project.json --output dist/jogo.rbxlx

      - name: Publicar apenas na experiencia de desenvolvimento
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          if [ -z "$ROBLOX_API_KEY" ]; then
            echo "::error::Secret ROBLOX_API_KEY nao configurado. Publicacao nao realizada."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 8 --retry-all-errors --retry-delay 20 --max-time 90 \
            --request POST \
            --url "https://apis.roblox.com/universes/v1/${ROBLOX_TEST_UNIVERSE_ID}/places/${ROBLOX_TEST_PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary "@dist/jogo.rbxlx"

      - name: Confirmar destino
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Destino unico deste workflow - experiencia privada de desenvolvimento."
